<!DOCTYPE html>
<html lang="uk" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>EngLift — вивчай англійську</title>
  <meta name="description" content="EngLift — сучасний PWA-застосунок для вивчення англійської: граматика, словник, аудіювання та інтерактивні тренажери.">
  <meta name="theme-color" content="#070812">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="EngLift">

  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-192.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/themes.css">
  <link rel="stylesheet" href="css/reader.css">
  <link rel="stylesheet" href="css/diary.css">
  <link rel="stylesheet" href="css/placement.css">
  <link rel="stylesheet" href="css/phrases.css">
  <link rel="stylesheet" href="css/sound.css">
  <link rel="stylesheet" href="css/search.css">
  <link rel="stylesheet" href="css/effects.css">
</head>
<body>
  <div class="bg-glow" aria-hidden="true"></div>
  <div class="bg-fx" id="bg-fx" aria-hidden="true"><canvas id="fx-canvas" hidden></canvas></div>
  <div id="fx-aura" aria-hidden="true"></div>
  <script src="js/themes.js"></script>
  <script>
    /* тема — одразу, до завантаження важких словників (без «блимання») */
    (function () {
      try {
        var s = JSON.parse(localStorage.getItem('fluentlab_v2') || '{}').settings || {};
        var rm = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
        window.FLThemes.apply(s.theme || 'dark', s.motion == null ? !rm : s.motion);
      } catch (e) { window.FLThemes && window.FLThemes.apply('dark', true); }
    })();
  </script>

  <aside class="sidebar" id="sidebar">
    <a class="logo" href="#/">
      <span class="logo-mark">
        <svg viewBox="0 0 40 40" fill="none"><defs><linearGradient id="lg" x1="0" y1="0" x2="40" y2="40"><stop style="stop-color:var(--a1)"/><stop offset="1" style="stop-color:var(--a2)"/></linearGradient></defs><rect x="2" y="2" width="36" height="36" rx="11" fill="url(#lg)"/><g transform="translate(2 2) scale(.643) translate(-4 -4)"><path d="M14 46V18h18v6H21v5h9v6h-9v5h11v6H14z" fill="#0b0d17"/><path d="M44 15l7.5 12h-5.5v17.5a2 2 0 0 1-4 0V27h-5.5z" fill="#0b0d17"/></g></svg>
      </span>
      <span class="logo-text">Eng<em>Lift</em></span>
    </a>

    <nav class="nav" id="nav" aria-label="Головна навігація"></nav>

    <div class="sidebar-footer">
      <div class="streak-pill" id="streak-pill" title="Серія днів навчання">
        <span class="flame">🔥</span><span id="streak-count">0</span> дн. поспіль
      </div>
      <button class="settings-btn" id="settings-btn">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
        Налаштування
      </button>
    </div>
  </aside>

  <div class="sidebar-backdrop" id="sidebar-backdrop"></div>

  <main class="main">
    <header class="topbar">
      <button class="hamburger" id="hamburger" aria-label="Меню">
        <span></span><span></span><span></span>
      </button>
      <div class="crumbs" id="crumbs"></div>
      <div class="topbar-right">
        <button class="srch-btn" id="search-btn" aria-label="Пошук по застосунку" title="Пошук (Ctrl + K)">
          <span aria-hidden="true">🔍</span><span class="srch-btn-text">Пошук…</span><kbd>Ctrl K</kbd>
        </button>
        <div class="xp-pill" id="xp-pill" title="Досвід і рівень">
          <span class="xp-star">⭐</span><span id="xp-value">0</span>&nbsp;XP
          <span class="xp-sep">·</span>
          <span id="level-value">Рівень 1</span>
        </div>
        <button class="theme-toggle" id="theme-toggle" aria-label="Теми оформлення" title="Теми оформлення"><span class="theme-dot"></span>
          <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
          <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4m11.4-11.4 1.4-1.4"/></svg>
        </button>
      </div>
    </header>

    <div class="view" id="view"></div>
  </main>

  <div id="modal-root"></div>
  <div class="toast" id="toast" role="status"></div>
  <canvas id="confetti"></canvas>

  <script src="js/core.js"></script>
  <script src="js/lexis/meta.js"></script>
  <script src="js/data.js"></script>
  <script src="js/grammar-extra.js"></script>
  <script src="js/lexis.js"></script>
  <script src="js/grammar.js"></script>
  <script src="js/reader.js"></script>
  <script src="js/diary/checker.js"></script>
  <script src="js/diary.js"></script>
  <script src="js/placement.js"></script>
  <script src="js/phrases.js"></script>
  <script src="js/sound.js"></script>
  <script src="js/search.js"></script>
  <script src="js/app.js"></script>
  <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js').catch(function () { /* offline-режим недоступний у цьому середовищі */ });
      });
    }
  </script>
</body>
</html>
